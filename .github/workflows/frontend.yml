name: frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      - name: Typecheck (ts-check 파일만)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
